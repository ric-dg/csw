name: Bug report
description: Something in csw doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `csw doctor`
      description: It lists versions and account status only, no tokens.
      render: text
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
  - type: input
    id: env
    attributes:
      label: OS and shell
      placeholder: e.g. Arch Linux, dash 0.5.13 / Ubuntu 24.04 (WSL), bash 5.2

name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write     # create the release
      id-token: write     # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dash busybox jq shellcheck fish
      - name: Version in csw matches the tag
        run: |
          v=$(sed -n 's/^CSW_VERSION=//p' csw)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "csw says $v, tag is $GITHUB_REF_NAME"; exit 1; }
      - name: Lint and test
        run: |
          shellcheck csw install.sh tests/*.sh tests/fakes/* tools/*.sh
          SHELLS="dash bash busybox-ash" sh tests/run.sh
      - name: Checksum
        run: sha256sum csw > csw.sha256
      # lets anyone check the file came from this workflow: gh attestation verify csw --repo ric-dg/csw
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: csw
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" csw csw.sha256 install.sh \
            --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md. Verify: sha256sum -c csw.sha256, or gh attestation verify csw --repo $GITHUB_REPOSITORY"
